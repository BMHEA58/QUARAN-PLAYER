name: Static site validation
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f README.md
      - name: Check JavaScript syntax
        run: node --check app.js && node --check sw.js
