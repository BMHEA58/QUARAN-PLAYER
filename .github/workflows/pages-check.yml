name: Static site validation
on:
  push:
    branches: [main, master, fix/player-reliability]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f README.md
          test -f tests/player-core.test.mjs
      - name: Check JavaScript syntax
        run: node --check app.js && node --check sw.js
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
